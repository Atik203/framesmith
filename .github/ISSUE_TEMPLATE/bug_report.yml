name: Bug report
description: Report a reproducible problem in Framesmith.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        For security vulnerabilities, do not open a public issue. Follow [SECURITY.md](https://github.com/Atik203/framesmith/blob/main/SECURITY.md).
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the smallest set of steps that reproduces the problem.
      placeholder: |
        1. Run ...
        2. Provide ...
        3. Observe ...
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Python/Node version, and relevant tool or model versions. Never include API keys.
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Remove secrets, personal data, generated media, and large files before sharing.
      render: text
    validations:
      required: false
