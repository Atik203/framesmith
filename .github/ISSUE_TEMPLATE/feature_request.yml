name: Feature request
description: Suggest a focused improvement that fits the current project direction.
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem should this solve?
      description: Describe the user need, not just the proposed implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain the smallest useful change and how you would use it.
    validations:
      required: true
  - type: checkboxes
    id: fit
    attributes:
      label: Project fit
      options:
        - label: I checked the README, blueprint, and roadmap for current scope and constraints.
          required: true
        - label: This proposal does not assume paid services, unattended publishing, or concurrent GPU-heavy jobs.
          required: false
