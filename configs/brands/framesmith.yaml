# Framesmith production profile. Keep deterministic production choices here, not in prompt text or code.

brand_id: framesmith
name: Framesmith
content_id_prefix: fs           # new IDs; existing lf-* records remain valid
niche: ai_stories
language: en
audience: global_english        # approximately 18-34
tone: [mysterious, emotional, cinematic, intelligent]

formats:
  short:
    composition: ShortVertical
    width: 1080
    height: 1920
    fps: 30
    min_duration_seconds: 30
    max_duration_seconds: 55
    scenes: {min: 6, max: 10}
  long_form:
    composition: LongHorizontal
    width: 1920
    height: 1080
    fps: 30
    min_duration_seconds: 480
    target_duration_seconds: {min: 600, max: 720}   # 10-12 min for story episodes; never pad
    max_duration_seconds: 720
    max_per_week: 1             # R12: cap at 1 per week, never more than 2
    derivative_shorts: {min: 3, max: 8}

variation_rules:                # R7: YouTube inauthentic-content policy
  min_story_structures: 3
  min_narrator_styles: 2
  min_visual_treatments: 2
  no_consecutive_same_structure: true

story_structures:               # Vertical A formats; rotate, never two in a row
  - psychological_twist
  - mystery
  - emotional_reveal
  - speculative_what_if
  - future_message
  - time_travel_consequence

hook_families:                  # log.csv `hook_family` values (Vertical A hook types)
  - question
  - contradiction
  - impossible_event
  - immediate_stakes

narrator_styles:                # log.csv `narrator_style`; R7 needs at least 2 in use per week
  - deep_neutral
  - warm_intimate               # reserved for future variation; not used in this video

visual_treatments:              # log.csv `visual_treatment`; R7 needs at least 2 in use per week
  - cinematic_anime
  - illustrated_realism         # reserved for future variation; not used in this video

narration:
  style: deep_neutral
  engine: kokoro                # R5 default; A/B test qwen3_tts_0_6b
  voice_id: am_michael          # initial deep-neutral candidate; review the first WAV
  voice_candidates: [am_michael, bm_george, am_adam]   # Kokoro voice names to audition by ear; confirm in the Kokoro voice list
  sample_rate: 24000
  rate: 0.97
  pronunciation:
    AI: "A-I"
    GPU: "G-P-U"

visual:
  style: cinematic_anime
  checkpoint: null              # TODO Day 1: SDXL-family anime (Illustrious or NoobAI); log license in provenance/licenses.csv
  long_form_still_size: "1344x768"   # keep the subject in the center third so Shorts can be cropped
  constraints: "No logos, no text, no copyrighted characters, no watermarks, no extra limbs, no malformed hands."

character_identity:             # one compact identity block per recurring character (reused in every scene prompt)
  - id: char-001
    name: Nora
    age_range: "29"
    hair: dark wavy hair tied low
    face_shape: oval
    clothing: long rust-red raincoat, dark work clothes
    palette: deep teal, rust red, warm amber
    distinguishing_props: brass janitor keys and a silver wristwatch

captions:
  preset: kinetic_white
  font_family: Segoe UI         # Windows system font; rendered into video, not embedded
  words_per_chunk: {min: 1, max: 7}
  note: Inside the platform safe zone, high contrast, avoid covering faces.

cta_policy: soft
watermark: none

forbidden_topics:
  - graphic violence
  - sexual content
  - hate or targeting of protected groups
  - political persuasion (not at launch)
  - copyrighted franchise characters

rules:
  no_fake_true_story_framing: true
  no_ai_persona_advice: true    # no finance, medical or legal advice from an AI persona
  use_synthetic_media_disclosure: true
  human_pass_required: true     # every script and final cut
